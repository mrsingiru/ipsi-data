name: 규정 점검(플랫폼·법·약관 원문 바뀜)

on:
  schedule:
    - cron: '20 20 * * 6'   # 매주 일요일 오전 5시 20분(한국 시간) — 마케팅 주간 예약(일요일 14:42)보다 먼저
  workflow_dispatch:
  push:   # 규정 대장이나 점검 코드가 바뀌면 바로 한 번 봄
    branches: [main]
    paths: ['watch/rules.json', 'scripts/check_rules.py']

permissions:
  contents: write

concurrency:
  group: rules
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 도구 설치
        run: pip install requests beautifulsoup4 lxml pdfminer.six olefile
      - name: 규정 원문 열어 보기(robots 지킴, 원문은 저장하지 않음)
        run: python scripts/check_rules.py watch/rules.json data/rules_status.json data/rules_report.md
      - name: 바뀐 것이 있으면 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rules_status.json data/rules_report.md || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "규정 점검 $(TZ=Asia/Seoul date +%F)"
            git pull --rebase -q || true
            git push
          fi
