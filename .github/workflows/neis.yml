name: 나이스 자료 받기(학교 목록·시험 날짜)

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 오전 6시(한국 시간) = 전날 21시(UTC)
  workflow_dispatch:        # Actions 화면에서 'Run workflow'로 바로 실행
    inputs:
      mode:
        description: '시험 날짜 범위: rotate(오늘 몫) 또는 all(전부, 처음 한 번)'
        required: false
        default: 'rotate'

permissions:
  contents: write

concurrency:
  group: neis
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 학교 목록 받기
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
        run: python scripts/fetch_schools.py
      - name: 시험 날짜 받기(중·고등학교 학사일정)
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          MODE: ${{ github.event.inputs.mode || 'rotate' }}
        run: python scripts/fetch_exams.py
      - name: 바뀐 것이 있으면 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "나이스 자료 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
