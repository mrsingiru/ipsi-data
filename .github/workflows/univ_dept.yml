name: 공공데이터 받기(학과별 충원 현황 · 대학 기본정보 · 학교별 학과 · 공휴일)

# 2026-11-14 대표 '학과별 경쟁률부터' · 17:55 'API 사용하면 자동화 되지 않을까?' — 공공데이터포털 15163924 자동변환 오픈 API.
# 해마다 한 번 새 해가 올라옴(포털 차기 등록 예정 2027-08-31) → 달마다 확인, 바뀐 것이 없으면 저장하지 않음.
on:
  schedule:
    - cron: '41 20 * * 0'    # 매주 월요일 05:41(한국 시간) = 일요일 20:41(UTC) — 공휴일(임시공휴일)은 자주 보고, 학과·대학 자료는 바뀐 것이 없으면 저장하지 않음. 나이스(매일 15:17)·자료 점검(04:10)과 겹치지 않게
  workflow_dispatch:          # Actions 화면에서 'Run workflow'로 바로 실행
    inputs:
      diag:
        description: '응답 살펴보기만(yes) — 저장 안 함'
        required: false
        default: 'no'
      only:
        description: 'apis = 학과별 충원 현황은 건너뛰고 나머지만'
        required: false
        default: 'all'

permissions:
  contents: write

concurrency:
  group: univ_dept
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 11/14 첫 전체 실행이 30분에 끊김(학과별 13분 + 학교 200여 곳 학과)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 응답 살펴보기(diag=yes일 때만, 키는 찍지 않음)
        if: github.event.inputs.diag == 'yes'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/diag_odcloud.py && python scripts/diag_apis.py
      - name: 학과별 신입생 충원 현황 받기
        if: github.event.inputs.diag != 'yes'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          # 학과별 충원 현황은 1년에 한 번 바뀜 → 매주 예약에서는 그달 첫 월요일(1~7일)에만, 손으로 누르면 언제나(only=apis면 건너뜀)
          if [ "${{ github.event.inputs.only }}" = "apis" ]; then echo '건너뜀(only=apis)'; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%d)" -gt 7 ]; then echo '이번 주는 건너뜀(그달 첫 월요일만)'; exit 0; fi
          python scripts/fetch_univ_dept.py
      - name: 대학 기본정보 · 학교별 학과 · 공휴일 받기
        if: always() && github.event.inputs.diag != 'yes'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_public_apis.py
      - name: 바뀐 것이 있으면 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "공공데이터 갱신 $(TZ=Asia/Seoul date +%F)"
            git pull --rebase --autostash || true
            git push
          fi
