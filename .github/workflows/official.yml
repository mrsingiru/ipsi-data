name: 공식 공고 읽기(영재원·학교 모집 날짜)

on:
  schedule:
    - cron: '40 20 * * *'   # 매일 오전 5시 40분(한국 시간) — 자료 점검 예약(06:16)보다 먼저
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 읽기 도구 설치(PDF·HWP)
        run: |
          pip install requests beautifulsoup4 lxml pdfminer.six olefile
          sudo apt-get install -y -qq poppler-utils >/dev/null || true
      - name: 공식 공고에서 날짜 줄 뽑기
        run: python scripts/fetch_official.py watch/targets.json data/official
      - name: 점검용 기록을 debug 가지에 잠깐 두기(main에는 넣지 않음, 고치기가 끝나면 지움)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          if [ -f debug/debug.json ]; then
            cp debug/debug.json /tmp/debug.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git stash -u -q || true
            git checkout -q --orphan debug-tmp
            git rm -rq --cached . >/dev/null 2>&1 || true
            mkdir -p d && cp /tmp/debug.json d/debug.json
            git add d/debug.json
            git commit -q -m "점검용 기록(임시)"
            git push -q -f origin debug-tmp:debug
            git checkout -q -f main
            git stash pop -q || true
          fi
      - name: 점검용 기록 올리기(저장소에는 넣지 않음)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-debug
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
      - name: 바뀐 것이 있으면 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official data/official_run.json || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "공식 공고 읽기 $(TZ=Asia/Seoul date +%F)"
            git pull --rebase -q || true
            git push
          fi
