name: 나이스 자료 받기(학교 목록·시험 날짜)

on:
  schedule:
    - cron: '17 6 * * *'   # 매일 오후 3시 17분(한국 시간) = 같은 날 6시 17분(UTC). 2026-11-12 17:2x 대표 결정 '오후 3시 17분으로':
                           # 11/11 밤 8시 17분 예약이 7시간 23분 늦게(04:17) 끝나 04:10 '자료 점검'이 7분 앞서 읽음 → 경보. 깃허브가 7시간 넘게 늦어도 자정 전에 끝나게
                           # (그 전: 11/11 '전날 밤 8시 17분', 예전 04:30)
  workflow_dispatch:        # Actions 화면에서 'Run workflow'로 바로 실행
    inputs:
      mode:
        description: '시험 날짜 범위: rotate(오늘 몫) 또는 all(전부, 처음 한 번)'
        required: false
        default: 'rotate'

permissions:
  contents: write

concurrency:
  group: neis
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 인증키가 있는지 보기(없으면 오늘은 쉬기)
        id: key
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
        run: |
          echo "started=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          if [ -z "$NEIS_KEY" ]; then
            echo "::notice::비밀 값 NEIS_KEY가 아직 없어 오늘은 건너뜁니다(README '처음 한 번 설정' 참고)."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'yes'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ready == 'yes'
        with:
          python-version: '3.12'
      - name: 학교 목록 받기
        if: steps.key.outputs.ready == 'yes'
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
        run: python scripts/fetch_schools.py
      - name: 시험 날짜 받기(중·고등학교 학사일정)
        if: steps.key.outputs.ready == 'yes'
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          MODE: ${{ github.event.inputs.mode || 'rotate' }}
        run: python scripts/fetch_exams.py
      - name: 실행 결과 남기기(data/status.json — 운영실 '자료 수집기' 상태의 근거)
        # 예약 작업 세션에서는 GitHub API가 막혀 실행 기록을 못 읽는다. 저장소 복사는 되므로 결과를 파일로 남긴다(성공·실패 모두).
        if: always() && steps.key.outputs.ready == 'yes'
        env:
          CONCLUSION: ${{ job.status }}
          STARTED: ${{ steps.key.outputs.started }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, datetime
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          st = {'workflow': 'neis', 'conclusion': os.environ['CONCLUSION'], 'event': os.environ['EVENT'],
                'runUrl': os.environ['RUN_URL'], 'startedAt': os.environ['STARTED'], 'finishedAt': now}
          try:
              st['schools'] = json.load(open('data/run.json', encoding='utf-8')).get('schools')
          except Exception:
              pass
          json.dump(st, open('data/status.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print(st)
          PY
      - name: 바뀐 것이 있으면 저장
        if: always() && steps.key.outputs.ready == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "나이스 자료 갱신 $(TZ=Asia/Seoul date +%F)"
            git pull --rebase --autostash || true
            git push
          fi
