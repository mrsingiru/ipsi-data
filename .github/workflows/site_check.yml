name: ipsinote.com 열림 확인

# 2026-11-12 실행 1 창 — 11/11 1부 '자료·서비스 신호등'(ipsinote.com 열림)이 회의 준비 한 장에서 늘 '확인 필요'로 나오던 것 고침.
# 까닭: 새벽 예약 세션의 웹 열기(WebFetch)는 사람 승인이 필요해 막히고, 예약 세션의 명령줄은 ipsinote.com에 닿지 못함.
# 그래서 깃허브가 3시간마다 주소 2개를 열어 보고, 결과는 이 실행의 성공·실패로만 남긴다(저장소에 아무것도 쓰지 않음).
# 회의 준비 한 장 도구(ipsi-site tools/meetprep.py)가 공개 API로 마지막 결과를 읽는다 — 성공 = 열림, 실패 = 안 열림.
# 깃허브 예약은 몇 시간씩 늦게 돌 수 있어(11/11 실제 약 7시간) 하루 8번으로 둔다.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 첫 화면·앱 화면 열기
        run: |
          fail=0
          for u in https://ipsinote.com/ https://ipsinote.com/app/; do
            code=$(curl -sS -L -o page.html -w '%{http_code}' --max-time 30 -A 'ipsinote-site-check' "$u" || echo 000)
            if [ "$code" = "200" ] && grep -q '입시노트' page.html; then
              echo "열림 $u ($code)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "안 열림 $u (응답 $code)" | tee -a "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done
          exit $fail
